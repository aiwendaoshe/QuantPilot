name: Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢建议！请尽量写清背景，帮助我们理解需求。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前有什么痛点或不足？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望如何实现或改进？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充背景
      description: 任何其他上下文、参考链接、截图等
