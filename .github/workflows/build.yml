name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 允许 action-gh-release 创建 Release
permissions:
  contents: write

jobs:
  build:
    name: Build QuantPilot (Windows installer)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (gate)
        run: npm run typecheck

      - name: Build & package Windows installer
        run: npm run dist:win
        env:
          # 仓库未配置代码签名证书，关闭 electron-builder 的签名/编辑步骤
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifact (every run)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: QuantPilot-Windows-${{ github.sha }}
          path: release/QuantPilot-Setup-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: QuantPilot ${{ github.ref_name }}
          files: release/QuantPilot-Setup-*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
